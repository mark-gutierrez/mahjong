<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahjong Realtime</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Landing Screen -->
        <div id="landing" class="screen">
            <h1 class="title">MAHJONG</h1>
            <div class="card">
                <input type="text" id="nickname" placeholder="Enter your nickname" autocomplete="off" />
                <div class="actions">
                    <button id="btn-create">Create a New Room</button>
                    <div class="divider">or</div>
                    <input type="text" id="room-code" placeholder="Enter Room Code" autocomplete="off" />
                    <button id="btn-join" class="btn-secondary">Join Room</button>
                </div>
            </div>
            
            <div id="saved-replays-container" style="margin-top: 30px; width: 100%; max-width: 600px;">
                <h3 style="color: rgba(255,255,255,0.7); border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px; margin-bottom: 15px;">Local Replays</h3>
                <div id="replays-list-ui" style="display: flex; flex-direction: column; gap: 10px;">
                    <!-- Replay list injected here -->
                </div>
            </div>
        </div>
        
        <!-- Lobby / Waiting Room Screen -->
        <div id="lobby" class="screen hidden">
            <div class="card">
                <h2>Waiting Room</h2>
                <div class="room-code-display">
                    Room Code: <span id="display-room-code" class="highlight">---</span>
                </div>
                
                <div class="players-container">
                    <h3>Players <span class="count">(1/4)</span></h3>
                    <ul class="players-list" id="players-list">
                        <li>You (Host)</li>
                        <li class="empty-slot">Waiting for player...</li>
                        <li class="empty-slot">Waiting for player...</li>
                        <li class="empty-slot">Waiting for player...</li>
                    </ul>
                </div>
                
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button id="btn-leave-room" class="btn-secondary" style="flex: 1;">Leave Room</button>
                    <button id="btn-start" disabled style="flex: 2;">Start Game</button>
                </div>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game" class="screen hidden">
            <div id="opponents-area" class="opponents-container">
                <!-- Opponent info populated dynamically -->
            </div>

            <div style="position: absolute; top: 1rem; right: 1rem; display: flex; gap: 10px;">
                <button id="toggle-bot-actions" class="btn-secondary" style="padding: 0.5rem 1rem; font-size: 0.8rem; background: #8b5cf6;">Enable Bot Actions</button>
                <button id="toggle-analytics" class="btn-secondary" style="padding: 0.5rem 1rem; font-size: 0.8rem; background: #6366f1;">Show Analytics</button>
                <button id="toggle-style" class="btn-secondary" style="padding: 0.5rem 1rem; font-size: 0.8rem;">Toggle Basic Tiles</button>
            </div>

            <div class="center-board">
                <div class="turn-indicator">
                    <h2 id="current-turn-display">Waiting...</h2>
                    <div id="turn-timer" class="timer-badge">--</div>
                </div>
                
                <div class="discard-area">
                    <h3>Center Discard Pool</h3>
                    <div id="discard-pool" class="discard-pool"></div>
                </div>
            </div>

            <div class="player-area">
                <div id="melds-area" class="melds-container"></div>
                <div class="hand-container" id="my-hand"></div>
                
                <div id="bot-quick-actions" style="margin-top: 15px; display: flex; gap: 10px; justify-content: center; opacity: 0; transition: opacity 0.3s; pointer-events: none;">
                    <button class="btn-secondary" onclick="executeBotAlg('Shanten')" style="font-size: 0.8em; padding: 5px 10px; background: #4f46e5; border-color: #4f46e5;">🤖 Shanten</button>
                    <button class="btn-secondary" onclick="executeBotAlg('Betaori')" style="font-size: 0.8em; padding: 5px 10px; background: #10b981; border-color: #10b981;">🛡️ Betaori</button>
                    <button class="btn-secondary" onclick="executeBotAlg('Push/Fold')" style="font-size: 0.8em; padding: 5px 10px; background: #ef4444; border-color: #ef4444;">⚔️ Push/Fold</button>
                    <button class="btn-secondary" onclick="executeBotAlg('Heuristic')" style="font-size: 0.8em; padding: 5px 10px; background: #f59e0b; border-color: #f59e0b;">🧮 Heuristic</button>
                </div>
            </div>
        </div>
        <!-- Replay Screen -->
        <div id="replay" class="screen hidden">
            <div class="card" style="max-width: 900px; width: 100%;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2>Game Replay Viewer</h2>
                    <button id="btn-exit-replay" class="btn-secondary">Back to Lobby</button>
                </div>
                
                <div id="replay-board" style="display: flex; flex-direction: column; gap: 20px; background: rgba(0,0,0,0.3); padding: 20px; border-radius: 8px;">
                    <!-- Replay dynamically rendered here -->
                </div>

                <div style="margin-top: 20px; display: flex; align-items: center; gap: 15px;">
                    <button id="btn-replay-prev" class="btn-secondary">◀ Prev Turn</button>
                    <input type="range" id="replay-slider" min="0" max="0" value="0" style="flex: 1;" />
                    <button id="btn-replay-next" class="btn-secondary">Next Turn ▶</button>
                </div>
            </div>
        </div>
    </div>
    <script src="replay.js"></script>
    <script src="app.js"></script>
</body>
</html>
